$kind: http-request
name: Login
method: POST
url: '{{baseUrl}}/login'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "string",
      "password": "string"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.collectionVariables.set("token", pm.response.json().jwtToken);
