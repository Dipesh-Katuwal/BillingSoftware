$kind: http-request
name: Register User
method: POST
url: '{{baseUrl}}/admin/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "string",
      "email": "string",
      "password": "string",
      "role": "string"
    }
