spring.datasource.url=jdbc:mysql://localhost:3306/billing_software
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.region=ap-southeast-2
aws.s3.bucket=dipesh-billingsoftware-2026

jwt.secret.key=thisismysecretkeyforbillingsoftware

# eSewa test/sandbox configuration
esewa.base-url=https://rc-epay.esewa.com.np
esewa.status-url=https://rc.esewa.com.np
esewa.product-code=EPAYTEST
esewa.secret-key=${ESEWA_TEST_SECRET_KEY:}
esewa.success-url=http://localhost:8080/payments/esewa/success
esewa.failure-url=http://localhost:8080/payments/esewa/failure
esewa.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Khalti ePayment sandbox configuration. Set KHALTI_TEST_SECRET_KEY from test-admin.khalti.com.
khalti.base-url=https://dev.khalti.com/api/v2
khalti.secret-key=${KHALTI_TEST_SECRET_KEY:}
khalti.return-url=${KHALTI_RETURN_URL:http://localhost:8080/payments/khalti/callback}
khalti.website-url=${FRONTEND_URL:http://localhost:5173}
khalti.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Stripe hosted Checkout, test mode only. No Stripe credentials are sent to React.
stripe.test-secret-key=${STRIPE_TEST_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.frontend-url=${FRONTEND_URL:http://localhost:5173}
stripe.minimum-total-npr=${STRIPE_MINIMUM_TOTAL_NPR:100.00}
spring.mvc.problemdetails.enabled=true
